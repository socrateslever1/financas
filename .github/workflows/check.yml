name: Verificação Open Minha Finanças
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: python tests/schema_sqlite.py
      - run: node --check functions/api/_session.js && node --check functions/api/auth.js && node --check functions/api/state.js
